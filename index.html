<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayı Tahmin Savaşı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1, h2 { text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%; padding: 10px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 6px; font-size: 16px;
        }
        button {
            width: 100%; padding: 12px; background-color: #007bff;
            color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-bottom: 10px;
        }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        button.secondary { background-color: #28a745; }
        
        .history-item { display: flex; justify-content: space-between; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .guess-p1 { background-color: #e9f5ff; border-left: 4px solid #007bff; }
        .guess-p2 { background-color: #fdeced; border-right: 4px solid #d9534f; }
        
        #room-info { text-align: center; font-size: 18px; color: #d9534f; font-weight: bold; margin-bottom: 5px; }
        #my-secret-display { text-align: center; font-size: 16px; font-weight: bold; color: #17a2b8; margin-bottom: 15px; padding: 5px; background: #e8f4f8; border-radius: 6px;}
        .status-text { text-align: center; font-style: italic; color: #666; margin-bottom: 15px; font-weight: bold;}
        
        /* Buton Tasarımları */
        .btn-play-again { background-color: #28a745; margin-bottom: 10px; }
        .btn-play-again:hover { background-color: #218838; }
        .leave-btn { background-color: #dc3545; }
        .leave-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sayı Tahmin Oyunu</h1>
    
    <div id="lobby-screen">
        <button onclick="window.location.href='kurallar.html'" style="background-color: #17a2b8; margin-bottom: 25px;">📖 Nasıl Oynanır?</button>
        
        <h3>Yeni Oyun Kur</h3>
        <div class="input-group">
            <label>Basamak Sayısı (En az 3):</label>
            <input type="number" id="lobby-digit-count" min="3" value="4">
        </div>
        <div class="input-group">
            <label>Oda Kodu Belirleyin:</label>
            <input type="text" id="lobby-room-code-create" placeholder="Örn: 1234 veya ODA1">
        </div>
        <div class="input-group">
            <label>Gizli Sayınızı Belirleyin (Rakamları Farklı):</label>
            <input type="text" inputmode="numeric" id="lobby-secret-create" placeholder="Örn: 1907" maxlength="4">
        </div>
        <button id="btn-create-room">Oda Kur</button>
        
        <hr>
        
        <h3>Mevcut Odaya Katıl</h3>
        <div class="input-group">
            <label>Oda Kodu:</label>
            <input type="text" id="lobby-room-code" placeholder="Örn: 1234 veya ODA1">
        </div>
        <div class="input-group">
            <label>Gizli Sayınızı Belirleyin (Rakamları Farklı):</label>
            <input type="text" inputmode="numeric" id="lobby-secret-join" placeholder="Örn: 1907">
        </div>
        <button id="btn-join-room" class="secondary">Odaya Katıl</button>
    </div>

    <div id="game-screen" style="display: none;">
        <div id="room-info"></div>
        <div id="my-secret-display"></div>
        <div id="game-status" class="status-text">Bağlanıyor...</div>
        
        <div class="input-group">
            <input type="text" inputmode="numeric" id="guess-input" placeholder="Tahmininizi girin">
        </div>
        <button id="btn-make-guess">Tahmin Et</button>
        
        <button id="btn-play-again" class="btn-play-again" style="display: none;" onclick="window.location.reload()">🔄 Tekrar Oyna (Lobiye Dön)</button>
        
        <button id="btn-leave-game" class="leave-btn" onclick="if(confirm('Oyundan çıkıp ana menüye dönmek istediğinize emin misiniz?')) window.location.reload()">🚪 Ana Menüye Dön</button>

        <div class="history" id="history-list">
            <h3 style="margin-top: 20px;">Geçmiş Tahminler</h3>
            <div id="guesses-container"></div>
        </div>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
